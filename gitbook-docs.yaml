$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Cybersecurity Certification & Education Portfolio
  structure:
    - type: section
      key: section-career-development
      title: Career Development
      path: career-development
      description: Academic background and the professional cybersecurity development roadmap.
      icon: graduation-cap
      children:
        - type: space
          key: space-career-roadmap
          title: Career Roadmap
          path: career-roadmap
          content:
            directory: ./_roadmap
        - type: space
          key: space-education
          title: Education
          path: education
          default: true
          content:
            directory: ./education/wgu-bs-computer-science
    - type: section
      key: section-certifications
      title: Certifications
      path: certifications
      description: Study notes and supporting documentation for completed and in-progress certifications.
      icon: award
      children:
        - type: space
          key: space-isc2-cc
          title: ISC2 Certified in Cybersecurity (CC)
          path: isc2-cc
          content:
            directory: ./isc2-cc
        - type: space
          key: space-itil-4-foundation
          title: ITIL 4 Foundation
          path: itil-4-foundation
          content:
            directory: ./itil-4-foundation
        - type: space
          key: space-linux-essentials
          title: Linux Essentials
          path: linux-essentials
          content:
            directory: ./linux-essentials
        - type: space
          key: space-security-plus
          title: CompTIA Security+
          path: security-plus
          content:
            directory: ./security-plus
    - type: section
      key: section-knowledge-library
      title: Knowledge Library
      path: knowledge-library
      description: Reusable technical concepts, authorized labs, and curated references.
      icon: book-open
      children:
        - type: space
          key: space-technical-knowledge
          title: Technical Knowledge
          path: technical-knowledge
          content:
            directory: ./technical-knowledge
        - type: space
          key: space-labs
          title: Security Labs
          path: labs
          content:
            directory: ./labs
        - type: space
          key: space-resources
          title: Resources
          path: resources
          content:
            directory: ./resources
